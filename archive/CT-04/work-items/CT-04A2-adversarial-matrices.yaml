- id: A2A-RETIRE
  title: Repository retirement storage semantics
  slice: CT-04A2a
  governing_invariant: retirement terminal and releases active reservation only after durable transition
  protected_default: true
  cases:
  - id: A2A-RET-001
    setup: active repository with two bindings
    operation: retire transaction fixture
    expected: repository and both bindings retire atomically
  - id: A2A-RET-002
    setup: retirement transaction rolls back
    operation: forced rollback
    expected: repository/bindings unchanged
  - id: A2A-RET-003
    setup: second retirement
    operation: transition
    expected: idempotent/no state rewrite
  - id: A2A-RET-004
    setup: retired repository used for new binding
    operation: insert
    expected: rejected
  - id: A2A-RET-005
    setup: retired repository inspection relation mutated
    operation: update
    expected: historical evidence remains immutable
  - id: A2A-RET-006
    setup: new row reuses retired path/common/fingerprint
    operation: insert
    expected: permitted with new ID
  - id: A2A-RET-007
    setup: direct SQL unretire
    operation: update
    expected: rejected
  - id: A2A-RET-008
    setup: direct SQL delete retired row
    operation: delete
    expected: rejected
