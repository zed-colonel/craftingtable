purpose: Source-grounded positive, negative, structural, concurrency, crash, and fan-in cases for A2a/A2b.
matrices:
- id: A2A-STATUS
  title: Repository status reducer
  slice: CT-04A2a
  governing_invariant: A2 repository state table
  protected_default: true
  cases:
  - id: A2A-STATUS-001
    setup: active plus exact same evidence
    operation: reduce
    expected: active, no version transition
  - id: A2A-STATUS-002
    setup: active plus risk-only difference
    operation: reduce
    expected: active with evidence-change disposition, no repository version transition
  - id: A2A-STATUS-003
    setup: active plus environmental-only difference
    operation: reduce
    expected: identity-evidence-changed
  - id: A2A-STATUS-004
    setup: active plus core difference
    operation: reduce
    expected: identity-mismatch
  - id: A2A-STATUS-005
    setup: active plus path unavailable
    operation: reduce
    expected: unavailable
  - id: A2A-STATUS-006
    setup: active plus observation-raced
    operation: reduce
    expected: no state change
  - id: A2A-STATUS-007
    setup: unavailable plus exact accepted evidence
    operation: reduce
    expected: active
  - id: A2A-STATUS-008
    setup: unavailable plus environment difference
    operation: reduce
    expected: identity-evidence-changed
  - id: A2A-STATUS-009
    setup: identity-evidence-changed plus accepted baseline returns
    operation: reduce
    expected: active
  - id: A2A-STATUS-010
    setup: identity-mismatch plus ordinary inspect
    operation: reduce
    expected: terminal rejection
  - id: A2A-STATUS-011
    setup: evidence-blocked plus ordinary inspect
    operation: reduce
    expected: terminal rejection
  - id: A2A-STATUS-012
    setup: any non-retired plus retire
    operation: reduce
    expected: retired
  - id: A2A-STATUS-013
    setup: retired plus any recovery
    operation: reduce
    expected: rejected
  - id: A2A-STATUS-014
    setup: unsupported transition
    operation: reduce
    expected: explicit error, never default transition
- id: A2A-REPOSITORY
  title: Registered repository structural model
  slice: CT-04A2a
  governing_invariant: structural ownership and immutable core identity
  protected_default: true
  cases:
  - id: A2A-REP-001
    setup: coherent workspace/repository/registration evidence
    operation: commit
    expected: accepted
  - id: A2A-REP-002
    setup: repository without registration inspection
    operation: commit
    expected: deferred FK/constraint rejects
  - id: A2A-REP-003
    setup: registration inspection belongs to another repository
    operation: commit
    expected: composite FK rejects
  - id: A2A-REP-004
    setup: environment baseline belongs to another repository
    operation: commit
    expected: composite FK rejects
  - id: A2A-REP-005
    setup: same canonical path in active row another workspace
    operation: insert
    expected: global active uniqueness rejects
  - id: A2A-REP-006
    setup: same common Git directory in active row
    operation: insert
    expected: global active uniqueness rejects
  - id: A2A-REP-007
    setup: same core fingerprint in active row
    operation: insert
    expected: global active uniqueness rejects
  - id: A2A-REP-008
    setup: same identities after old row retired
    operation: insert
    expected: new registration permitted with new ID
  - id: A2A-REP-009
    setup: mutate workspace/core identity/display name/registration actor
    operation: SQL update
    expected: trigger rejects
  - id: A2A-REP-010
    setup: delete repository row
    operation: SQL delete
    expected: trigger rejects
  - id: A2A-REP-011
    setup: status transition without version+1
    operation: SQL update
    expected: trigger rejects
  - id: A2A-REP-012
    setup: version bump without allowed state/baseline transition
    operation: SQL update
    expected: trigger rejects
  - id: A2A-REP-013
    setup: partial status actor/time/reason fields
    operation: insert/update
    expected: check rejects
  - id: A2A-REP-014
    setup: malformed display name/control/length
    operation: contract/storage
    expected: rejected
- id: A2A-INSPECTION
  title: Immutable inspection evidence
  slice: CT-04A2a
  governing_invariant: append-only exact full-record evidence
  protected_default: true
  cases:
  - id: A2A-INSP-001
    setup: successful registration observation
    operation: insert
    expected: all success fields required; failure fields null
  - id: A2A-INSP-002
    setup: failed verification attempt
    operation: insert
    expected: bounded failure fields required; observation fields null
  - id: A2A-INSP-003
    setup: mixed success and failure fields
    operation: insert
    expected: check rejects
  - id: A2A-INSP-004
    setup: success missing JSON/digest/version/fingerprint
    operation: insert
    expected: check rejects
  - id: A2A-INSP-005
    setup: failure missing code/subject/category/retryability
    operation: insert
    expected: check rejects
  - id: A2A-INSP-006
    setup: inspection references foreign-workspace repository
    operation: insert
    expected: composite FK rejects
  - id: A2A-INSP-007
    setup: actor exists but is not workspace member
    operation: direct SQL
    expected: database proves user existence/membership relation per accepted boundary; service active-role remains A2b
  - id: A2A-INSP-008
    setup: update inspection evidence
    operation: SQL update
    expected: trigger rejects
  - id: A2A-INSP-009
    setup: delete inspection evidence
    operation: SQL delete
    expected: trigger rejects
  - id: A2A-INSP-010
    setup: unsorted/duplicate risk or difference arrays
    operation: insert/parser
    expected: rejected
  - id: A2A-INSP-011
    setup: oversized JSON/evidence metadata
    operation: insert/contract
    expected: rejected
  - id: A2A-INSP-012
    setup: exact observation bytes and digest read back
    operation: round trip
    expected: byte-identical
  - id: A2A-INSP-013
    setup: corrupt observation bytes with stale digest
    operation: A2b read contract fixture
    expected: integrity failure
  - id: A2A-INSP-014
    setup: observation digest length/case invalid
    operation: insert
    expected: check rejects
- id: A2A-BASELINE
  title: Environmental baseline and reaffirmation storage
  slice: CT-04A2a
  governing_invariant: baseline belongs to same repository and updates only through governed transition
