    expected: trigger rejects
  - id: A2A-BASE-005
    setup: baseline update without version increment
    operation: update
    expected: trigger rejects
  - id: A2A-BASE-006
    setup: baseline update and active transition coherent
    operation: update
    expected: accepted
  - id: A2A-BASE-007
    setup: baseline update mutates core identity
    operation: update
    expected: trigger rejects
  - id: A2A-BASE-008
    setup: direct delete baseline relation
    operation: delete
    expected: rejected
