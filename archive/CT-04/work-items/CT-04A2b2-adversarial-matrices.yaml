  - id: B2-REAFF-007
    setup: failed observation
    operation: reaffirm
    expected: failure evidence; old baseline preserved
  - id: B2-REAFF-008
    setup: forced rollback
    operation: reaffirm
    expected: baseline/status/audit/event all unchanged; no notifier
  origin: inherited-CT-04A2b
- id: B2-BINDING
  title: Project bind and unbind
  slice: CT-04A2b2c
