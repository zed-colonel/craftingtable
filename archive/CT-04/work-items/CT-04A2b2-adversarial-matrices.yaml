purpose: Inherited and source-grounded adversarial cases allocated to the recursive B2 lifecycle children.
matrices:
- id: B2-CONFIG
  title: Optional repository feature configuration
  slice: CT-04A2b2a
  governing_invariant: A2B-I02/A2B-I13
  protected_default: true
  cases:
  - id: B2-CFG-001
    setup: no repository variables
    operation: start daemon
    expected: feature disabled; existing planning/auth works
  - id: B2-CFG-002
    setup: repository operation while disabled
    operation: request
    expected: actionable unavailable; no A1 call
  - id: B2-CFG-003
    setup: valid explicit roots/options
    operation: authorized first use
    expected: lazy A1 creation succeeds
  - id: B2-CFG-004
    setup: partial explicit configuration
    operation: start
    expected: fails rather than silently disables
  - id: B2-CFG-005
    setup: invalid roots/overlap
    operation: start
    expected: fails closed
  - id: B2-CFG-006
    setup: concurrent first authorized calls
    operation: create provider
    expected: one in-flight creation result shared
  - id: B2-CFG-007
    setup: creation failure
    operation: retry
    expected: bounded explicit cache/retry policy followed
  - id: B2-CFG-008
    setup: unauthorized caller
    operation: request
    expected: no configuration/root/Git details disclosed
  origin: inherited-CT-04A2b
- id: B2-ADAPTER
  title: A1 adapter and evidence integrity
  slice: CT-04A2b2a
  governing_invariant: A2B-I01/A2B-I03/A2B-I07
  protected_default: true
  cases:
  - id: B2-ADP-001
    setup: A1/domain constants equal
    operation: construct adapter
    expected: available
  - id: B2-ADP-002
    setup: risk/error/difference vocabulary drift
    operation: construct adapter
    expected: feature fails closed
  - id: B2-ADP-003
    setup: exact stored bytes and digest valid
    operation: verify
    expected: A1 parsed observation and projection parity accepted
  - id: B2-ADP-004
    setup: stored digest mismatch
    operation: verify
    expected: storage-integrity failure; A1 inspect/compare not called
  - id: B2-ADP-005
    setup: stored JSON invalid or unsupported version
    operation: verify
    expected: storage-integrity failure
  - id: B2-ADP-006
    setup: stored projected columns disagree
    operation: verify
    expected: stored-evidence-invalid
  - id: B2-ADP-007
    setup: A1 repository-class error
    operation: map
    expected: explicit repository-class-changed assessment
  - id: B2-ADP-008
    setup: observation-raced/timeouts/overflow
    operation: map
    expected: failed evidence, no automatic identity transition
  - id: B2-ADP-009
    setup: successful comparison with core+env+risk differences
    operation: map
    expected: core priority while all difference arrays retained
  - id: B2-ADP-010
    setup: only environment+risk differences
    operation: map
    expected: environment priority while risk evidence retained
  origin: inherited-CT-04A2b
- id: B2-AUTH
  title: Authorization before host access
  slice: CT-04A2b2b
  governing_invariant: A2B-I02
  protected_default: true
  cases:
  - id: B2-AUTH-001
    setup: Owner register
    operation: request
    expected: A1 may be created/called
  - id: B2-AUTH-002
    setup: Editor/Viewer register
    operation: request
    expected: 403 before provider/host access
  - id: B2-AUTH-003
    setup: Owner/Editor inspect/bind/unbind
    operation: request
    expected: allowed by exact operation policy
  - id: B2-AUTH-004
    setup: Viewer host-affecting read/inspect
    operation: request
    expected: denied before A1
  - id: B2-AUTH-005
    setup: nonmember or foreign resource
    operation: request
    expected: indistinguishable 404; zero A1 calls
  - id: B2-AUTH-006
    setup: revoked membership
    operation: request
    expected: denied before A1 despite structural historical FK
  - id: B2-AUTH-007
    setup: Owner reaffirm/retire
    operation: request
    expected: allowed
  - id: B2-AUTH-008
    setup: Editor reaffirm/retire
    operation: request
    expected: denied
  - id: B2-AUTH-009
    setup: known member insufficient role
    operation: request
    expected: bounded denied audit; no event/notifier
  - id: B2-AUTH-010
    setup: unauthenticated request
    operation: request
    expected: existing authentication behavior; no A1
  origin: inherited-CT-04A2b
- id: B2-REGISTER
  title: Double-inspection registration
  slice: CT-04A2b2b
  governing_invariant: A2B-I05/A2B-I07
  protected_default: true
  cases:
  - id: B2-REG-001
    setup: two matching valid observations
    operation: register
    expected: one repo+inspection+audit+event; notify after commit
  - id: B2-REG-002
    setup: core/environment/risk difference between inspections
    operation: register
    expected: retryable conflict; no repository/event/notifier
  - id: B2-REG-003
    setup: first or second observation-raced
    operation: register
    expected: failed audit only; no accepted state
  - id: B2-REG-004
    setup: invalid display name and unsafe derived basename
    operation: register
    expected: rejected before A1 where derivable
  - id: B2-REG-005
    setup: same-workspace same identity duplicate
    operation: register
    expected: existing result; no duplicate event
  - id: B2-REG-006
    setup: same path but conflicting local non-retired state
    operation: register
    expected: conflict; use lifecycle command
  - id: B2-REG-007
    setup: identity reserved by another workspace
    operation: register
    expected: non-disclosing conflict; no foreign audit/event
  - id: B2-REG-008
    setup: identity reserved only by retired row
    operation: register
    expected: fresh RepositoryId allowed
  - id: B2-REG-009
    setup: two concurrent registrations
    operation: register
    expected: one create; typed idempotent/conflict loser
  - id: B2-REG-010
    setup: outer transaction forced rollback
    operation: register
    expected: no state/audit/event/notifier
  - id: B2-REG-011
    setup: commit succeeds, notifier drops
    operation: reconnect
    expected: durable event replayed
  - id: B2-REG-012
    setup: audit metadata
    operation: inspect
    expected: both observation digests/comparison booleans bounded; no raw observation/stderr
  origin: inherited-CT-04A2b
- id: B2-INSPECT
  title: Verification and repository state
  slice: CT-04A2b2b
  governing_invariant: A2B-I03/A2B-I05/A2B-I06/A2B-I07
  protected_default: true
  cases:
  - id: B2-INSP-001
    setup: valid same observation
    operation: inspect
    expected: evidence+audit; no state event/version/notifier
  - id: B2-INSP-002
    setup: risk-only difference
    operation: inspect
    expected: evidence event; repository version unchanged
  - id: B2-INSP-003
    setup: environment difference
    operation: inspect
    expected: identity-evidence-changed + status event
  - id: B2-INSP-004
    setup: core difference
    operation: inspect
    expected: identity-mismatch/core-identity-changed
  - id: B2-INSP-005
    setup: repository class error
    operation: inspect
    expected: identity-mismatch/repository-class-changed
  - id: B2-INSP-006
    setup: path unavailable/metadata unreadable
    operation: inspect
    expected: unavailable according to exact mapping
  - id: B2-INSP-007
    setup: process/config/observation-raced failure
    operation: inspect
    expected: failed evidence/audit; no state change
  - id: B2-INSP-008
    setup: stored digest invalid
    operation: inspect
    expected: evidence-blocked; no A1 call
  - id: B2-INSP-009
    setup: unavailable then matching observation
    operation: inspect
    expected: active/evidence-matches
  - id: B2-INSP-010
    setup: unavailable then class/core mismatch
    operation: inspect
    expected: identity-mismatch, never active
  - id: B2-INSP-011
    setup: terminal/retired repository
    operation: inspect
    expected: rejected before A1
  - id: B2-INSP-012
    setup: stale expected version
    operation: inspect
    expected: conflict before A1 and rechecked in transaction
  - id: B2-INSP-013
    setup: concurrent inspections
    operation: inspect
    expected: immutable ordered evidence; at most one state transition event per version
  - id: B2-INSP-014
    setup: outer commit failure after nested primitives
    operation: inspect
    expected: all state/audit/event/evidence rollback; no notifier
  origin: inherited-CT-04A2b
- id: B2-REAFFIRM
  title: Environmental evidence reaffirmation
  slice: CT-04A2b2b
  governing_invariant: A2B-I08/A2B-I09
  protected_default: true
  cases:
  - id: B2-REAFF-001
    setup: identity-evidence-changed + fresh same-core/different-env
    operation: reaffirm
    expected: baseline advances, active, IDs/bindings preserved
  - id: B2-REAFF-002
    setup: non-Owner
    operation: reaffirm
    expected: denied before A1
  - id: B2-REAFF-003
    setup: stale repository version
    operation: reaffirm
    expected: conflict before A1
  - id: B2-REAFF-004
    setup: stale latest-successful inspection ID
    operation: reaffirm
    expected: conflict before/inside transaction
  - id: B2-REAFF-005
    setup: fresh core/class mismatch
