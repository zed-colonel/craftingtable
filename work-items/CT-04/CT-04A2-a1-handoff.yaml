  - environmentalEvidence
  - riskScan
  - observedAt
comparison_outputs:
- coreDifferences
- environmentalDifferences
- riskScanDifferences
- sameCoreIdentity
- sameEnvironmentalEvidence
- sameRiskScanEvidence
binding_limitations:
- non-root POSIX only
- Git 2.32 or newer
- source roots containing colon rejected
- filesystem deadlines cooperative
- hard daemon death does not bound orphan lifetime
- ordinary top-level worktree activity may produce observation-raced
- full record integrity belongs to A2
- ownership/root paths lack real second-UID/root acceptance host coverage
forbidden_a2_behavior:
- deep import A1 modules
- node:child_process outside accepted A1 module
- construct Git argv/env
- ambient PATH fallback
- treat risk scan as mutation authorization
- treat observation-raced as identity loss
error_state_mapping:
  unavailable:
  - path-unavailable
  - repository-metadata-unreadable
  identity_mismatch:
  - symlink-rejected
  - ownership-refused
  - not-primary-repository
  - not-git-repository
  - unsupported-object-format
  - unsupported-repository-extension
  evidence_blocked:
